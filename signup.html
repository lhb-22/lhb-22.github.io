<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입 | LHB GAMES</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #bba7e3; /* 톤다운 보라 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      color: #333;
    }

    .signup-card {
      width: 100%;
      max-width: 460px;
      background-color: #f7f3ff;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.18);
      padding: 28px 28px 26px;
    }

    .signup-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .signup-logo {
      font-size: 20px;
      font-weight: 800;
      color: #5c2cff;
      margin-bottom: 6px;
    }

    .signup-title {
      font-size: 18px;
      font-weight: 700;
      color: #5c2cff;
      margin-bottom: 4px;
    }

    .signup-sub {
      font-size: 12px;
      color: #777;
    }

    form {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 13px;
      color: #555;
    }

    input {
      border-radius: 999px;
      border: 1px solid #ccc;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      background-color: #fff;
    }

    input:focus {
      border-color: #5c2cff;
      box-shadow: 0 0 0 2px rgba(92,44,255,0.12);
    }

    .helper {
      font-size: 11px;
      color: #999;
    }

    .signup-btn {
      margin-top: 10px;
      border: none;
      border-radius: 999px;
      background-color: #5c2cff;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 10px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(92,44,255,0.35);
      width: 100%;
    }

    .signup-btn:hover {
      filter: brightness(1.05);
    }

    .bottom-text {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }

    .bottom-text a {
      color: #5c2cff;
      text-decoration: none;
      font-weight: 600;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    .error {
      font-size: 11px;
      color: #d63333;
      margin-top: 2px;
      display: none;
    }

    .success-msg {
      margin-top: 8px;
      font-size: 12px;
      color: #16a34a;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="signup-card">
    <div class="signup-header">
      <div class="signup-logo">LHB GAMES</div>
      <div class="signup-title">회원가입</div>
      <div class="signup-sub">미니게임 월드를 즐기기 위한 계정을 만들어 보세요 🎮</div>
    </div>

    <form id="signupForm">

      <!-- 닉네임 (username) -->
      <div class="field-group">
        <label for="usernameInput">닉네임</label>
        <input id="usernameInput" type="text" placeholder="게임에서 사용할 이름" required>
      </div>

      <!-- 로그인 ID (loginId) -->
      <div class="field-group">
        <label for="loginIdInput">로그인 ID</label>
        <input id="loginIdInput" type="text" placeholder="로그인에 사용할 ID를 입력하세요" required>
      </div>

      <!-- 비밀번호 -->
      <div class="field-group">
        <label for="passwordInput">비밀번호</label>
        <input id="passwordInput" type="password" placeholder="비밀번호를 입력하세요" required>
        <div class="helper">영문/숫자 조합 8자 이상을 추천합니다.</div>
      </div>

      <!-- 비밀번호 확인 -->
      <div class="field-group">
        <label for="password2Input">비밀번호 확인</label>
        <input id="password2Input" type="password" placeholder="비밀번호를 다시 입력하세요" required>
        <div class="error" id="pwError">비밀번호가 일치하지 않습니다.</div>
      </div>

      <button type="submit" class="signup-btn">회원가입 완료</button>
      <div class="success-msg" id="successMsg">회원가입이 완료되었습니다! 🎉</div>
    </form>

    <div class="bottom-text">
      이미 계정이 있나요?
      <a href="MyPage.html">로그인 하러 가기</a>
    </div>

  </div>

  <script>
    const form = document.getElementById("signupForm");
    const usernameInput = document.getElementById("usernameInput");
    const loginIdInput  = document.getElementById("loginIdInput");
    const passwordInput = document.getElementById("passwordInput");
    const password2Input= document.getElementById("password2Input");
    const pwError       = document.getElementById("pwError");
    const successMsg    = document.getElementById("successMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const loginId  = loginIdInput.value.trim();
      const password = passwordInput.value.trim();
      const password2= password2Input.value.trim();

      // 1) 비밀번호 확인
      if (password !== password2) {
        pwError.style.display = "block";
        successMsg.style.display = "none";
        password2Input.focus();
        return;
      } else {
        pwError.style.display = "none";
      }

      // 2) 빈 값 체크 (프론트에서도 한 번 더)
      if (!username || !loginId || !password) {
        alert("닉네임, 로그인 ID, 비밀번호를 모두 입력해주세요.");
        return;
      }

      try {
        // 3) 서버로 회원가입 요청
        const res = await fetch("http://localhost:3000/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: username,
            loginId: loginId,
            password: password
          })
        });

        const data = await res.json();

        if (data.ok) {
          successMsg.style.display = "block";
          alert("회원가입이 완료되었습니다! 이제 Games 화면에서 로그인해보세요 😊");
          form.reset();
        } else {
          successMsg.style.display = "none";
          alert(data.message || "회원가입 중 오류가 발생했습니다.");
        }
      } catch (err) {
        console.error(err);
        successMsg.style.display = "none";
        alert("서버에 연결할 수 없습니다. server.js가 켜져 있는지 확인해주세요!");
      }
    });
  </script>

</body>
</html>
