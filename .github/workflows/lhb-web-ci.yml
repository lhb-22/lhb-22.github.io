name: LHB Web CI/CD

on:
  push:
    branches: [ "main" ]   # main 브랜치에 푸시될 때마다 실행
  workflow_dispatch:        # 필요하면 Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# ---------------------------
# 1) 백엔드 CI (Node 서버)
# ---------------------------
jobs:
  backend:
    name: Backend CI (Node + 서버)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .   # 루트(서버 코드 있는 곳)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install backend deps
        run: npm install

      # 테스트 스크립트가 없으면 그냥 통과하도록 (--if-present)
      - name: Run backend tests (optional)
        run: npm test --if-present

      # 옵션: Dockerfile 제대로 빌드되는지만 확인
      - name: Build Docker image (check only)
        run: docker build -t lhb_web_server .

  # ---------------------------
  # 2) 프론트엔드 빌드 + Pages 배포
  # ---------------------------
  frontend:
    name: Frontend CI + GitHub Pages 배포
    runs-on: ubuntu-latest
    needs: backend          # 백엔드 job 끝난 후 실행

    defaults:
      run:
        working-directory: ./frontend   # React 프로젝트 폴더

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend deps
        run: npm install

      - name: Build React app
        run: npm run build
        env:
          # eslint 경고를 에러로 처리하지 않도록
          CI: false

      # build/ 폴더를 Pages 아티팩트로 업로드
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build

      # GitHub Pages에 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
