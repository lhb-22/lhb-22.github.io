name: LHB Web CI

on:
  push:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI (Node + 서버)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend deps
        run: npm ci

      # ✅ 테스트는 아직 없으니까 그냥 스킵 메시지만 찍고 통과시키기
      - name: Skip backend tests (no tests yet)
        run: echo "No backend tests yet – skipping."

      # ✅ Dockerfile이 잘 빌드되는지만 확인 (푸시 X)
      - name: Build Docker image (check only)
        run: docker build -t lhb_web_server .

  frontend:
    name: Frontend CI + GitHub Pages 배포
    needs: backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
