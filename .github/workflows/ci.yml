name: LHB Web CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend (Node + Dockerfile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend deps
        run: npm install

      - name: Run backend tests (optional)
        run: |
          if [ -f "package.json" ] && cat package.json | grep -q "\"test\""; then
            npm test
          else
            echo "no backend tests"
          fi

      - name: Build Docker image
        run: docker build -t lhb_web_server .

  frontend-ci:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend deps
        run: npm install

      - name: Build frontend
        run: npm run build
