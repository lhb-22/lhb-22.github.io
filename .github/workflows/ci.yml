name: LHB Web CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # =========================
  # 🔧 Backend CI (Node + Docker)
  # =========================
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install backend deps
        run: npm install

      - name: Run backend tests (optional)
        run: npm test --if-present

      - name: Build backend Docker image
        run: docker build -t lhb_web_server .

  # =========================
  # 🎨 Frontend CI (React)
  # =========================
  frontend:
    runs-on: ubuntu-latest
    needs: backend

    # 기본 작업 폴더를 frontend 로 고정
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend deps
        # 🔥 여기서 npm ci 대신 npm install 사용!
        run: npm install

      - name: Build frontend
        run: npm run build
